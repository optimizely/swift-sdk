name: Swift

on:
  push:
    branches: [ master, 'release/**' ]
  pull_request:
    branches: [ master, 'release/**' ]
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded runs of the same PR; push/manual runs get a unique group so none are queued or dropped
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:

  lint_markdown_files:
    uses: ./.github/workflows/lint_markdown.yml

  # Errors fail the job; warnings are reported but don't (Sources only, like the DemoSwiftApp build phase)
  swiftlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SWIFTLINT_VERSION: 0.65.1
      # sha256 of swiftlint_linux_amd64.zip for the version above; update both together
      SWIFTLINT_SHA256: caeed6f4a679c35539ffaf124f6c4ab4a8416917f7d8796279dc52b74026059d
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - name: Download SwiftLint
      run: |
        curl -fsSL -o swiftlint.zip "https://github.com/realm/SwiftLint/releases/download/$SWIFTLINT_VERSION/swiftlint_linux_amd64.zip"
        echo "$SWIFTLINT_SHA256  swiftlint.zip" | sha256sum -c -
        unzip -q swiftlint.zip swiftlint-static -d .swiftlint-bin
    - run: .swiftlint-bin/swiftlint-static Sources --reporter github-actions-logging

  integration_tests:
    # ci-helper-tools' trigger script only understands push and pull_request events
    if: github.event_name != 'workflow_dispatch'
    uses: ./.github/workflows/integration_tests.yml
    secrets:
      CI_USER_TOKEN: ${{ secrets.CI_USER_TOKEN }}

  # Compile the package for every platform in Package.swift, on the newest and oldest supported Xcode
  build:
    name: build (${{ matrix.xcode }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - xcode: Xcode_27.0
            runner: xcode-27
          - xcode: Xcode_16.0
            runner: macos-15
    env:
      DEVELOPER_DIR: /Applications/${{ matrix.xcode }}.app/Contents/Developer
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - run: |
        swift build
        for target in iphoneos:arm64-apple-ios15.0 appletvos:arm64-apple-tvos15.0 watchos:arm64_32-apple-watchos9.0; do
          sdk=${target%%:*}
          echo "::group::$sdk"
          swift build --scratch-path ".build-$sdk" --triple "${target#*:}" --sdk "$(xcrun --sdk "$sdk" --show-sdk-path)"
          echo "::endgroup::"
        done

  # Fails when the PR breaks public API compared to its base branch (expected only for major releases)
  api_breaking_changes:
    if: github.event_name == 'pull_request'
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
        persist-credentials: false
    - env:
        BASE_REF: ${{ github.base_ref }}
      run: swift package diagnose-api-breaking-changes "origin/$BASE_REF"

  unittests:
    uses: ./.github/workflows/unit_tests.yml
