name: Reusable action of Unit tests

on: [workflow_call]

permissions:
  contents: read

env:
  COVERAGE_DIR: ./COVERAGE

jobs:
  unittests:
    runs-on: xcode-27
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: "27.0"
            device: "iPhone 17"
            scheme: "OptimizelySwiftSDK-iOS"
            test_sdk: "iphonesimulator"
            platform: "iOS Simulator"
            os_type: "iOS"
          - os: "27.0"
            device: "iPad Pro 11-inch (M5)"
            scheme: "OptimizelySwiftSDK-iOS"
            test_sdk: "iphonesimulator"
            platform: "iOS Simulator"
            os_type: "iOS"
          - os: "27.0"
            device: "iPhone Air"
            scheme: "OptimizelySwiftSDK-iOS"
            test_sdk: "iphonesimulator"
            platform: "iOS Simulator"
            os_type: "iOS"
          - os: "27.0"
            device: "Apple TV 4K (3rd generation)"
            scheme: "OptimizelySwiftSDK-tvOS"
            test_sdk: "appletvsimulator"
            platform: "tvOS Simulator"
            os_type: "tvOS"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: set SDK Branch if PR
        env:
          BASE_REF: ${{ github.base_ref }}
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          echo "BRANCH=$BASE_REF" >> $GITHUB_ENV
      - name: set SDK Branch if not pull request
        env:
          REF_NAME: ${{ github.ref_name }}
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          echo "BRANCH=$REF_NAME" >> $GITHUB_ENV
      - id: unit_tests
        name: Run unit tests
        # ponytail: retry masks flaky async-ordering tests; remove when they're deracinated
        env:
          SCHEME: ${{ matrix.scheme }}
          TEST_SDK: ${{ matrix.test_sdk }}
          PLATFORM: ${{ matrix.platform }}
          OS: ${{ matrix.os }}
          OS_TYPE: ${{ matrix.os_type }}
          NAME: ${{ matrix.device }}
        run: |
          for attempt in 1 2 3; do
            if Scripts/run_unit_tests.sh; then
              exit 0
            fi

            if [ "$attempt" -lt 3 ]; then
              echo "Unit tests failed on attempt $attempt; retrying..."
              rm -rf build "$COVERAGE_DIR"
            fi
          done

          exit 1
      - name: Check on failures (Archive Test Results)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: steps.unit_tests.outcome != 'success'
        with:
          name: build-logs-${{ matrix.device }}-${{ matrix.os }}
          path: build/Logs
      # - report coverage for the main iPhone simulator job only (avoid redundant ones)
      - name: Check on success
        id: coveralls
        if: ${{ steps.unit_tests.outcome == 'success' && env.BRANCH == 'master' && env.PLATFORM == 'iOS Simulator' && env.NAME == 'iPhone 17' }}
        # coverage is informational; a broken report must not fail the test job
        continue-on-error: true
        env:
          PLATFORM: ${{ matrix.platform }}
          NAME: ${{ matrix.device }}
        run: |
          Scripts/prepare_coveralls_report.sh
          sleep 5
      - name: Upload coveralls report
        if: steps.coveralls.outcome == 'success'
        continue-on-error: true
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path-to-lcov: ./xccov2lcov/lcov.info
